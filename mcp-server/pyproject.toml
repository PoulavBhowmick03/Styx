[project]
name = "styx-mcp-server"
version = "0.3.0"
description = "MCP server exposing Styx tools to any agent framework"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=2.0.0,<3.0.0",
    "styx-sdk==0.3.0",
]

[project.scripts]
styx-mcp-server = "styx_mcp.server:main"
styx-init = "styx_mcp.onboarding:init_main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/styx_mcp"]

[tool.uv.sources]
styx-sdk = { workspace = true }
