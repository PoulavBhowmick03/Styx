[project]
name = "styx-sdk"
version = "0.3.0"
description = "Thin Python binding over the Styx Rust client, no protocol logic"
requires-python = ">=3.11"
# The binding shells out to `styx-cli`, so an install without it resolves fine and then
# fails on the first call. The binary ships as its own platform wheel.
dependencies = ["styx-cli==0.3.0"]

[tool.uv.sources]
styx-cli = { workspace = true }

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/styx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
