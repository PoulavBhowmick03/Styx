[project]
name = "styx-sdk"
version = "0.3.0"
description = "Thin Python binding over the Styx agent CLI (styx-near-vault), no protocol logic"
requires-python = ">=3.11"
# The binding shells out to the agent CLI named by STYX_VAULT_CLI (sdk/near builds styx-near-vault).
dependencies = []

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/styx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
