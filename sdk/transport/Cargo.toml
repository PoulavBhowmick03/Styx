[package]
name = "styx-transport"
version = "0.1.0"
edition = "2021"
description = "Disclosure grants for Styx"
license = "Apache-2.0"

[dependencies]
# Canonical encoding and agreement types. Transport hashes retain their own version,
# independent of the agreement suite selected for settlement.
styx-core = { path = "../core" }
# Noise XX (X25519 / ChaCha20-Poly1305 / BLAKE2s). A maintained implementation of a documented
# handshake, chosen over hand-rolling X25519 + HKDF + AEAD. Decision DM2-1.
snow = "0.9"
# Entropy for transport identity keys and per-deal transcript randoms. Generated in Rust, like
# the SDK's existing channel randoms, so no binding makes a cryptographic decision.
rand = "0.8"
thiserror = "2"
# Suite-1 descriptor signatures. The core exposes verification; signing is transport-side.
# keccak256 derives the suite-1 address from the secp256k1 public key.
k256 = { version = "0.13", default-features = false, features = ["ecdsa", "std"] }
sha3 = "0.10"
hex = "0.4"
zeroize = "1"

[dev-dependencies]
tempfile = "3"

[lints.rust]
missing_docs = "warn"

[lints.clippy]
all = "deny"
