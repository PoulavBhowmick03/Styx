[package]
name = "styx-factory"
description = "Creates Styx vaults from a browser: one call creates <name>.<factory>, deploys the vault code and makes the caller its owner"
version = "0.1.0"
edition = "2021"
repository = "https://github.com/PoulavBhowmick03/Styx"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30"

[dev-dependencies]
near-sdk = { version = "5.30", features = ["unit-testing"] }
near-workspaces = { version = "0.24", features = ["unstable"] }
tokio = { version = "1.12.0", features = ["full"] }
serde_json = "1"
anyhow = "1"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(near)"] }
