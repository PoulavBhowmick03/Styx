[package]
name = "styx-usdc"
description = "A NEP-141 token with USDC's decimals, for the Styx vault on NEAR testnet. Not Circle's USDC."
version = "0.1.0"
edition = "2021"
repository = "https://github.com/PoulavBhowmick03/Styx"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30"
near-contract-standards = "5.30"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
