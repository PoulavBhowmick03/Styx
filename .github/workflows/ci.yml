name: Local verification
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      RUSTUP_TOOLCHAIN: 1.96.0
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - uses: astral-sh/setup-uv@6b9c6063abd6010835644d4c2e1bef4cf5cd0fca # v6.0.1
        with:
          version: '0.8.8'
      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1
        with:
          version: v1.5.1
          cache: false
      - run: rustup toolchain install 1.96.0 --profile minimal
      - name: Gitleaks (new commits; no license or secret required)
        shell: bash
        run: |
          curl -fsSLo "$RUNNER_TEMP/gitleaks.tar.gz" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          python3 .github/scripts/scan-secrets.py "$RUNNER_TEMP/gitleaks"
      - name: Rust EVM build and tests
        if: ${{ !cancelled() }}
        working-directory: sdk/evm
        run: cargo build --bins && cargo test --no-fail-fast && cargo test --test vault_local_chain -- --ignored
      - name: Rust core and transport
        if: ${{ !cancelled() }}
        run: (cd sdk/core && cargo test) && (cd sdk/transport && cargo test)
      - name: Contracts
        if: ${{ !cancelled() }}
        run: cd contracts/evm && forge test
      - name: Relay (also needed by owner browser tests)
        if: ${{ !cancelled() }}
        working-directory: relay
        run: npm install --legacy-peer-deps && npm run typecheck && npm test
      - name: Owner page and browser tests
        if: ${{ !cancelled() }}
        working-directory: owner-page
        run: npm install --legacy-peer-deps && npm run typecheck && npm test && npm run e2e
      - name: Arkiv
        if: ${{ !cancelled() }}
        working-directory: arkiv
        run: npm install --legacy-peer-deps && npm run typecheck && npm test
      - name: Python (documented failure remains visible)
        if: ${{ !cancelled() }}
        run: uv lock --check && uv sync --all-packages && python3 .github/scripts/python-tests.py
      - name: Local demo
        if: ${{ !cancelled() }}
        run: scripts/local_demo.sh
      - name: Watcher Anvil tests
        if: ${{ !cancelled() }}
        run: uv run pytest watcher/tests -v
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ always() }}
        with:
          name: python-test-results
          path: python-results.xml
          if-no-files-found: warn
  wheels:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      RUSTUP_TOOLCHAIN: 1.96.0
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@6b9c6063abd6010835644d4c2e1bef4cf5cd0fca # v6.0.1
        with:
          version: '0.8.8'
      - run: rustup toolchain install 1.96.0 --profile minimal
      - run: bash packaging/build-wheels.sh
      - run: uv run python packaging/smoke-install.py dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wheelhouse-${{ matrix.os }}
          path: dist/
          if-no-files-found: error
