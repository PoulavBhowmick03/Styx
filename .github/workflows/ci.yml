name: Local verification
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - uses: astral-sh/setup-uv@6b9c6063abd6010835644d4c2e1bef4cf5cd0fca # v6.0.1
        with:
          version: '0.8.8'
      - name: Gitleaks (new commits; no license or secret required)
        shell: bash
        run: |
          curl -fsSLo "$RUNNER_TEMP/gitleaks.tar.gz" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          python3 .github/scripts/scan-secrets.py "$RUNNER_TEMP/gitleaks"
      - name: NEAR vault contract (unit tests)
        if: ${{ !cancelled() }}
        working-directory: contracts/near/styx-vault
        run: cargo test --lib
      - name: Agent CLI
        if: ${{ !cancelled() }}
        working-directory: sdk/near
        run: cargo test
      - name: MCP server and SDK
        if: ${{ !cancelled() }}
        run: uv lock --check && uv sync --all-packages && uv run pytest -q
      - name: Reviewer
        if: ${{ !cancelled() }}
        working-directory: reviewer-near
        run: uv run --extra inference python -m unittest discover -s tests
      - name: NEAR AI agent runner
        if: ${{ !cancelled() }}
        working-directory: agent-near-ai
        run: uv run python -m unittest discover -s tests
      - name: Relay, approval page, owner console
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          for app in relay-near approval-page-near owner-console-near; do
            (cd "$app" && npm ci && npx tsc --noEmit && npx vitest run) || exit 1
          done
