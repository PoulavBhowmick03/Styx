[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "styx-near-review"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["PyNaCl>=1.5,<2"]

[project.optional-dependencies]
# Only needed to check NEAR AI Cloud inference evidence: ECDSA response signatures and TDX quotes.
inference = ["eth-account>=0.11", "dcap-qvl>=0.3.2"]

[project.scripts]
styx-near-review = "styx_near_review.cli:main"

[tool.setuptools.packages.find]
include = ["styx_near_review*"]
