<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Owner approval</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #fafaf9;
        --fg: #1c1917;
        --muted: #57534e;
        --line: #d6d3d1;
        --error: #b91c1c;
        --accent: #1d4ed8;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1c1917;
          --fg: #fafaf9;
          --muted: #a8a29e;
          --line: #44403c;
          --error: #fca5a5;
          --accent: #93c5fd;
        }
      }
      body {
        margin: 0 auto;
        max-width: 42rem;
        padding: 2rem 1rem;
        background: var(--bg);
        color: var(--fg);
        font: 16px/1.5 system-ui, sans-serif;
      }
      h1 { font-size: 1.5rem; margin: 0 0 1.5rem; }
      label { display: block; margin-bottom: 1rem; font-weight: 600; }
      input[type="file"] { display: block; margin-top: 0.25rem; font-weight: 400; max-width: 100%; }
      dl { display: grid; grid-template-columns: minmax(0, 9rem) minmax(0, 1fr); gap: 0.5rem 1rem; margin: 1.5rem 0; }
      dt { color: var(--muted); }
      dd { margin: 0; overflow-wrap: anywhere; }
      .value { font-weight: 600; }
      .mono { font-family: ui-monospace, monospace; font-size: 0.875rem; }
      .note { color: var(--muted); font-size: 0.875rem; font-weight: 400; }
      button {
        padding: 0.625rem 1.25rem;
        border: 0;
        border-radius: 0.375rem;
        background: var(--accent);
        color: var(--bg);
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      button:disabled { opacity: 0.6; cursor: wait; }
      #status { min-height: 1.5rem; margin: 1rem 0; }
      #status.error { color: var(--error); font-weight: 600; }
      textarea {
        box-sizing: border-box;
        width: 100%;
        height: 9rem;
        margin: 0.5rem 0;
        border: 1px solid var(--line);
        background: transparent;
        color: inherit;
        font: 0.875rem ui-monospace, monospace;
      }
    </style>
  </head>
  <body>
    <h1>Owner approval</h1>
    <label>
      Your owner config
      <input id="config-file" type="file" accept="application/json,.json" />
    </label>
    <label>
      Approval request from the agent
      <input id="pending-file" type="file" accept="application/json,.json" />
    </label>

    <section id="review" hidden>
      <dl>
        <dt>Amount</dt>
        <dd id="amount" class="value"></dd>
        <dt>Vendor</dt>
        <dd>
          <span id="vendor" class="value"></span>
          <div class="note">From your owner config</div>
        </dd>
        <dt>Recipient</dt>
        <dd id="recipient" class="mono"></dd>
        <dt>Rule exceeded</dt>
        <dd id="rule"></dd>
        <dt>Invoice reference</dt>
        <dd>
          <span id="invoice"></span>
          <div class="note">Written by the agent, not verified</div>
        </dd>
        <dt>Approval expires</dt>
        <dd id="expiry"></dd>
        <dt>Vault</dt>
        <dd id="vault" class="mono"></dd>
        <dt>Digest</dt>
        <dd id="digest" class="mono"></dd>
      </dl>
    </section>
    <button id="sign" type="button" hidden>Sign this exception</button>
    <p id="status" role="status"></p>

    <section id="output" hidden>
      <label for="output-text">Signature file</label>
      <textarea id="output-text" readonly></textarea>
      <a id="download">Download signature file</a>
    </section>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
