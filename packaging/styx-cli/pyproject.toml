[project]
name = "styx-cli"
version = "0.3.0"
description = "Prebuilt Styx vault and disclosure command line tools"
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["hatchling==1.30.1"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/styx_cli"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"
